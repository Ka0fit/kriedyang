<style>
/* Layout: one-column phone app; shared month calendar is home, bottom tab bar, every form opens as a sheet from the bottom */
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --ink:#1D2920; --muted:#5D6B61; --line:#DAE2D7;
  --leaf:#2E6A3D; --leaf-ink:#FFFFFF; --leaf-soft:#E2EEE3; --bark:#8A5A2B; --bark-soft:#F3EADF;
  --sky:#2C64A6; --sky-soft:#E1EAF5; --xtra:#6B4FA0; --xtra-soft:#ECE6F5; --warn:#B4432C; --warn-soft:#F8E4DE; --rain:#E3E9E7;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211B; --ink:#E5ECE6; --muted:#9BA89E; --line:#2A352D;
  --leaf:#72C185; --leaf-ink:#0F1A12; --leaf-soft:#1E3324; --bark:#D9AB78; --bark-soft:#2E251B;
  --sky:#7FB0EA; --sky-soft:#1A2838; --xtra:#B9A2E6; --xtra-soft:#262035; --warn:#E57E66; --warn-soft:#3A201A; --rain:#1E2724; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211B; --ink:#E5ECE6; --muted:#9BA89E; --line:#2A352D;
  --leaf:#72C185; --leaf-ink:#0F1A12; --leaf-soft:#1E3324; --bark:#D9AB78; --bark-soft:#2E251B;
  --sky:#7FB0EA; --sky-soft:#1A2838; --xtra:#B9A2E6; --xtra-soft:#262035; --warn:#E57E66; --warn-soft:#3A201A; --rain:#1E2724; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num,b{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}

.av{width:34px;height:34px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-family:var(--display);font-size:1rem;flex:none}
.urow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}

.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.pitem .who{flex:1;min-width:0}.pitem small{display:block;color:var(--muted);font-size:.82rem}
.pitem .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;color:var(--leaf-ink)}
.pitem[aria-pressed="true"]{border-color:var(--leaf)}.pitem[aria-pressed="true"] .ck{background:var(--leaf);border-color:var(--leaf)}
.pitem.done{background:var(--leaf-soft);border-color:transparent}.pitem.done .ck{border:0;color:var(--leaf);font-size:1.1rem}.pitem.done small{color:var(--leaf)}

.yoy thead th{border-top:0;font-size:.8rem;color:var(--muted)}
.up{color:var(--leaf);font-size:.78rem}.down{color:var(--warn);font-size:.78rem}
.lockwrap{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lk{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0}
.lk .app{font-family:var(--display);color:var(--leaf);font-size:1rem}
.lk .av{width:64px;height:64px;font-size:1.6rem}
.lk h2{text-align:center}
.pdots{display:flex;gap:16px;padding:6px 0}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--leaf)}
.pdots i.on{background:var(--leaf)}
.lmsg{min-height:1.4em;font-size:.9rem;color:var(--muted);text-align:center}

@media (prefers-reduced-motion:no-preference){.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}}

.keys button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.6rem}
.keys button.t{border:0;background:none;font-family:var(--body);font-size:.95rem;color:var(--muted)}
.keys button:active{background:var(--leaf-soft)}
.uswitch{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.uswitch button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.88rem}
.uswitch button[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf);font-weight:600}
.brand small{display:block;color:var(--muted);font-size:.85rem}
.banner{background:var(--bark-soft);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px}
.btn.primary{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf);font-weight:600}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn.ghost{border-style:dashed}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;flex:none}
.nbx{background:var(--leaf);color:var(--leaf-ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}

.nbx .sep{height:1px;background:currentColor;opacity:.25}
.nbl{background:var(--surface);color:var(--ink);border:2px solid var(--sky);border-left-width:6px;border-radius:16px;margin:0 0 14px}
.rlan{margin-bottom:14px}
.nbl .nh{color:var(--sky);opacity:1}
.nbl .bg{color:var(--sky)}
.nbl small{color:var(--muted);opacity:1}
.rlan .lanbar{margin-bottom:0}
.nrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nbig{flex:none;text-align:center;font-family:var(--display);line-height:1}
.nbig b{display:block;font-size:2.8rem;line-height:1}
.nbig small{font-family:var(--body);font-size:.8rem}
.nbig.td{font-size:2rem}
.nbl .nbig{color:var(--sky)}
.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}

.next .big{font-family:var(--display);font-size:1.6rem;color:var(--sky);line-height:1;text-align:right}
.next .big small{font-family:var(--body);font-size:.78rem;text-align:right}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:.78rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1/1.12;max-width:100%;border:1.5px solid transparent;border-radius:10px;background:transparent;padding:4px 3px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;text-align:left}
.day .d{font-size:.9rem;padding-left:3px;font-variant-numeric:tabular-nums}
.day .mk{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;min-height:9px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.c{background:var(--bark)} .dot.w{background:var(--sky)} .dot.p{background:var(--leaf);border-radius:2px} .dot.a{background:var(--warn);border-radius:2px;transform:rotate(45deg) scale(.85)}
.day .tag{font-size:.62rem;text-align:center;border-radius:5px;line-height:1.3;font-weight:600}
.tag.c{color:var(--bark);background:var(--bark-soft)} .tag.w{color:var(--sky);background:var(--sky-soft)}
.day.tap{background:var(--leaf-soft)}
.day.off{background:repeating-linear-gradient(135deg,var(--rain) 0 5px,transparent 5px 9px)}
.day.today{border-color:var(--leaf)} .day.today .d{color:var(--leaf);font-weight:600}
.day.blank{visibility:hidden}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:.8rem;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:500;font-size:1.2rem}
.stat.big{grid-column:1/-1} .stat.big b{font-size:1.6rem;color:var(--leaf)}
.lanbar{margin-bottom:10px}.lanbar button{flex:1}
.day.pick{outline:2px solid var(--sky);outline-offset:-2px}
.lgrid .tag{font-size:.62rem}
.pie{display:flex;flex-direction:column;align-items:center;gap:6px}
.pie svg{width:210px;height:210px;max-width:70vw;max-height:70vw}
.pie circle.sl{cursor:pointer;transition:opacity .2s,stroke-width .2s}
.pie.has-sel circle.sl:not(.on){opacity:.25}
.pie circle.sl.on{stroke-width:20}
.pleg{width:100%}
.pleg button{display:grid;grid-template-columns:12px 1fr auto minmax(2.6em,auto);gap:8px;align-items:center;width:100%;padding:10px 6px;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:8px}
.pleg button.on{background:var(--bg)}
.pleg .dt{width:12px;height:12px;border-radius:50%}
.pleg .pc{color:var(--muted);text-align:right;font-size:.85rem}
.tuamt{font-family:var(--display);font-size:2rem;text-align:center;padding:14px}
.tuw{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.3em}
.tuok{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px}
.tuok .ck{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:var(--leaf);color:var(--leaf-ink)}
.tuok.cx .ck{background:var(--warn)}
.tuok b{font-family:var(--display);font-size:1.25rem}

.wsum .sline{font-size:1.05rem}

.wadv{display:grid;grid-template-columns:4.6em 1fr auto;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:1rem}

.fbal{text-align:center;padding:6px 0 4px}.fbal .lb{color:var(--muted)}.fbal .am{font-family:var(--display);font-size:2.2rem;color:var(--bark)}
.frow{display:grid;grid-template-columns:3.6em 1fr auto 12px;gap:8px;align-items:center;width:100%;padding:11px 2px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}

.stat.big b small{font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--muted);margin-left:8px}
.xowe{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:10px 12px;margin-bottom:10px}

.xrow{display:grid;grid-template-columns:3.4em 1fr auto 12px;gap:8px;align-items:center;width:100%;padding:11px 2px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.xrow .dt{color:var(--muted);font-size:.88rem}.xrow small{display:block;color:var(--muted);font-size:.8rem}.xrow .v{text-align:right;font-weight:700}

<script>
const KEY='rubber-ledger-v2';
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_DS=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const now=new Date();
const TODAY=iso(now.getFullYear(),now.getMonth(),now.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const thDate=s=>{const dt=pd(s);return `${TH_D[dt.getDay()]} ${dt.getDate()} ${TH_MS[dt.getMonth()]} ${dt.getFullYear()+543}`};
const thShort=s=>{const dt=pd(s);return `${TH_DS[dt.getDay()]} ${dt.getDate()} ${TH_MS[dt.getMonth()]}`};
const dayDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const OWNER='owner',FUND='fund';

/* ตารางตลาด รอบปี 2569 ลานห้วยปลาโด: [รวมยาง, ชั่งยาง, จำนวนมีด] */
const SCHEDULE=[['2026-04-08','2026-04-09',9],['2026-04-29','2026-04-30',13],['2026-05-13','2026-05-14',9],['2026-05-27','2026-05-28',9],
['2026-06-10','2026-06-11',9],['2026-06-24','2026-06-25',9],['2026-07-08','2026-07-09',9],['2026-07-22','2026-07-23',9],['2026-08-05','2026-08-06',9],
['2026-08-19','2026-08-20',9],['2026-09-02','2026-09-03',9],['2026-09-16','2026-09-17',9],['2026-09-30','2026-10-01',9],['2026-10-14','2026-10-15',9],
['2026-10-28','2026-10-29',9],['2026-11-11','2026-11-12',9],['2026-11-25','2026-11-26',9],['2026-12-08','2026-12-09',9],['2026-12-23','2026-12-24',9],
['2027-01-13','2027-01-14',13],['2027-01-27','2027-01-28',9],['2027-02-10','2027-02-11',9],['2027-02-24','2027-02-25',9],['2027-03-10','2027-03-11',9],['2027-03-24','2027-03-25',9]];
const baseRounds=()=>SCHEDULE.map(([c,w,k],i)=>({id:'r'+(i+1),lanId:'L1',n:i+1,collect:c,weigh:w,knives:k}));

function blank(){return {lans:[],workers:[],days:{},rounds:[],pays:[],advances:[],fundOut:[],extras:[],paid:{},payouts:{},sample:false,lastSplit:null}}
const JOBS=['เก็บยาง','หยอดน้ำกรด','ถางหญ้า'];
const SAMPLE_V=15;
function sample(){
  // สวนจำลอง: ใช้งานจริงมาตั้งแต่ต้นรอบปี 1 เม.ย. 2569 จนถึงวันนี้
  let seed=20260401;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(rnd()*a.length)];const r2=v=>Math.round(v*100)/100;
  const s=blank();s.sample=true;s.sampleV=SAMPLE_V;
  s.workers=[{id:'w1',name:'สมชาย',kind:'main'},{id:'w2',name:'มาลี',kind:'main'},{id:'w3',name:'ลุงแดง',kind:'extra'},{id:'w4',name:'ป้าศรี',kind:'extra'}];
  const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d.getFullYear(),d.getMonth(),d.getDate())};
  const rain=k=>{const m=+k.slice(5,7);return rnd()<(m>=6&&m<=10?.28:.1)};
  // วันกรีด: กรีด 2 วัน หยุด 1 วัน ฝนตกก็หยุด
  let k='2026-04-01',cyc=0;
  while(k<=TODAY){cyc++;
    if(cyc%3===0)s.days[k]={off:true,workers:[]};/* พักหน้ายาง */
    else if(rain(k)) s.days[k]={off:true,workers:[]};
    else s.days[k]={off:false,workers:rnd()<.45?['w1','w2']:['w1']};
    k=addD(k,1);}
  const split=[{who:'w1',mode:'pct',val:35},{who:'w2',mode:'pct',val:10},{who:FUND,mode:'pct',val:5},{who:OWNER,mode:'rest',val:0}];
  s.lastSplit=split.map(l=>({...l}));
  // ผลชั่งและรับเงินแต่ละรอบ
  s.lans=[{id:'L1',name:'ลานห้วยปลาโด'},{id:'L2',name:'ลานบ้านใหม่'}];s.rounds=baseRounds();
  {let c2='2026-08-08',n2=0;while(c2<='2027-03-27'){n2++;s.rounds.push({id:'b'+n2,lanId:'L2',n:n2,collect:c2,weigh:addD(c2,1)});c2=addD(c2,14)}}
  // ขายลานไหนรอบไหน: ถ้ารอบของ 2 ลานใกล้กัน เลือกลานใดลานหนึ่ง
  const all=s.rounds.slice().sort((a,b)=>a.collect.localeCompare(b.collect));const sold=[];let lastSold=null;
  for(let i=0;i<all.length;i++){const r=all[i];if(r.weigh>TODAY)break;
    if(lastSold&&dayDiff(lastSold.collect,r.collect)<9)continue;
    const alt=all.slice(i+1).find(x=>x.lanId!==r.lanId&&dayDiff(r.collect,x.collect)<=5&&x.weigh<=TODAY);
    if(alt&&(rnd()<.45||alt.id==='b3'))continue;sold.push(r);lastSold=r}
  let price=21.8,prev=null;
  sold.forEach(r=>{
    const kn=Object.entries(s.days).filter(([d,v])=>!v.off&&d<=r.collect&&(!prev||d>prev.collect)).length;prev=r;
    price=r2(Math.min(27.5,Math.max(20.5,price+(rnd()-.35)*0.9)));
    r.kg=Math.round(kn*(72+rnd()*14));r.price=price;
    const pay=addD(r.weigh,1);if(pay>TODAY)return;
    const adj=[];if(rnd()<.7)adj.push({kind:'out',label:'ค่าลาน',amount:150});
    if(rnd()<.2){const w=1+Math.floor(rnd()*4);adj.push({kind:'out',label:`ยางชื้นโดนตัด ${w} กก.`,amount:r2(w*price)})}
    if(rnd()<.1)adj.push({kind:'in',label:'ลานให้ราคาพิเศษ',amount:200});
    const gross=r2(r.kg*r.price);const lines=split.map(l=>({...l}));if(r.id==='r7'){lines[1]={who:'w2',mode:'baht',val:1000}}
    const p={id:'p'+r.id,date:pay,roundId:r.id,kg:r.kg,price:r.price,gross,adj,lines,note:r.id==='r7'?'มาลีเหมาจ่ายรอบนี้':''};
    p.amount=payNet(p);s.pays.push(p);});
  // เบิกล่วงหน้า
  for(let m=3;m<=12;m++){const mk=`2026-${pad(m+1)}`;if(mk+'-05'>TODAY)break;
    if(rnd()<.75)s.advances.push({id:uid(),src:rnd()<.4?FUND:'own',who:'w1',date:mk+'-0'+(2+Math.floor(rnd()*4)),amount:pick([300,500,500,800,1000]),note:pick(['ค่าน้ำมันรถ','ค่าเทอมลูก','ค่ายา','ค่ากับข้าว'])});
    if(rnd()<.4)s.advances.push({id:uid(),src:'own',who:'w2',date:mk+'-0'+(3+Math.floor(rnd()*5)),amount:pick([200,300,500]),note:pick(['ค่ากับข้าว','ค่าไฟ','ค่าโทรศัพท์'])});
    if(rnd()<.5)s.advances.push({id:uid(),src:'own',who:OWNER,date:mk+'-'+(10+Math.floor(rnd()*15)),amount:pick([1000,2000,3000]),note:pick(['ค่าปุ๋ย','ผ่อนรถ','ค่าน้ำมัน'])});}
  if('2026-09-20'<=TODAY)s.advances.push({id:'aBig',src:'own',who:'w2',date:'2026-09-20',amount:2500,note:'ยืมซ่อมหลังคาบ้าน'});
  // จ้างเสริม
  for(let m=3;m<=12;m++){const n=1+Math.floor(rnd()*2);for(let i=0;i<n;i++){const d=`2026-${pad(m+1)}-${pad(5+Math.floor(rnd()*22))}`;if(d>=TODAY)continue;
    const job=pick(JOBS),w=pick(['w3','w3','w4']);s.extras.push({id:uid(),date:d,wid:w,name:({w3:'ลุงแดง',w4:'ป้าศรี'})[w],job,amount:job==='ถางหญ้า'?pick([400,500,600]):pick([200,250,300]),from:job==='หยอดน้ำกรด'?FUND:OWNER,note:'',paid:d,due:null})}}
  s.extras.push({id:uid(),date:addD(TODAY,-12),wid:'w4',name:'ป้าศรี',job:'เก็บยาง',amount:250,from:OWNER,note:'',paid:addD(TODAY,-9),due:null});
  s.extras.push({id:uid(),date:addD(TODAY,-6),wid:'w1',name:'สมชาย',job:'ขนยางไปลาน',amount:200,from:FUND,note:'ช่วยขนยางวันรวมยาง',paid:addD(TODAY,-6),due:null});
  s.extras.push({id:uid(),date:addD(TODAY,-4),wid:'w3',name:'ลุงแดง',job:'ถางหญ้า',amount:500,from:OWNER,note:'',paid:null,due:addD(TODAY,-2)});
  s.extras.push({id:uid(),date:addD(TODAY,-1),wid:'w3',name:'ลุงแดง',job:'เก็บยาง',amount:300,from:OWNER,note:'',paid:null,due:addD(TODAY,2)});
  s.extras.push({id:uid(),date:addD(TODAY,5),wid:'w4',name:'ป้าศรี',job:'หยอดน้ำกรด',amount:250,from:FUND,note:'',paid:addD(TODAY,5),due:null});
  // ซื้อของจากกองกลาง
  [['2026-04-03',350,'กรดฟอร์มิก 1 แกลลอน'],['2026-05-12',1200,'ถ้วยรองยาง 200 ใบ'],['2026-06-20',450,'มีดกรีดยาง'],['2026-07-25',350,'กรดฟอร์มิก 1 แกลลอน'],
   ['2026-08-30',280,'ลวดรัดถ้วย'],['2026-09-22',350,'กรดฟอร์มิก 1 แกลลอน'],['2026-10-06',180,'ลิ้นรองน้ำยาง']].forEach(([d,a,n])=>{if(d<=TODAY)s.fundOut.push({id:uid(),date:d,amount:a,note:n})});
  s.fundOut.push({id:uid(),date:addD(TODAY,7),amount:1200,note:'ถ้วยรองยาง 200 ใบ'});
  // จ่ายเงินลูกจ้าง: เดือนก่อนๆ จ่ายครบ เดือนนี้จ่ายสมชายแล้ว มาลียังค้าง
  const curM=TODAY.slice(0,7);const byM={};s.pays.forEach(p=>(byM[p.date.slice(0,7)]=byM[p.date.slice(0,7)]||[]).push(p));
  Object.entries(byM).forEach(([mk,ps])=>{ps.sort((a,b)=>a.date.localeCompare(b.date));
    ['w1','w2'].forEach(w=>{if(mk===curM&&w==='w2')return;let adv=s.advances.filter(a=>a.who===w&&a.date.startsWith(mk)).reduce((a,x)=>a+x.amount,0);
      ps.forEach(p=>{const l=splitCalc(p.amount,p.lines).lines.find(l=>l.who===w);if(!l)return;const d=Math.min(adv,l.baht);adv-=d;s.payouts[p.id+'|'+w]={date:p.date,amount:r2(l.baht-d),ded:d}})})});
  // ปีก่อน (2568): ผลชั่งและรับเงินทุกรอบ จ่ายค่าแรงครบแล้ว
  let pprice=19.6;
  SCHEDULE.forEach(([c,w,k],i)=>{const cy=addD(c,-364),wy=addD(w,-364);if(wy>addD(TODAY,-1))return;
    pprice=r2(Math.min(24,Math.max(18.5,pprice+(rnd()-.4)*0.8)));
    const r={id:'q'+(i+1),lanId:'L1',n:i+1,collect:cy,weigh:wy,knives:k,kg:Math.round(k*(60+rnd()*14)),price:pprice};s.rounds.push(r);
    const p={id:'pq'+(i+1),date:addD(wy,1),roundId:r.id,kg:r.kg,price:r.price,gross:r2(r.kg*r.price),adj:rnd()<.6?[{kind:'out',label:'ค่าลาน',amount:150}]:[],lines:split.map(l=>({...l})),note:''};
    p.amount=payNet(p);s.pays.push(p);
    ['w1','w2'].forEach(w=>{const l=splitCalc(p.amount,p.lines).lines.find(l=>l.who===w);if(l)s.payouts[p.id+'|'+w]={date:p.date,amount:l.baht,ded:0}});});
  {const d1=addD(TODAY,-20);s.topups=[{id:'t1',no:'TU-2568-0001',date:'2025-04-01',at:null,amount:1500,note:'ยอดยกมา (เงินในกองกลางก่อนเริ่มจด)',by:'เจ้าของสวน',cancel:null},
    {id:'t2',no:'TU-2569-0001',date:d1,at:d1+'T08:12',amount:20000,note:'เติมไว้ซื้อถ้วยรองยาง',by:'เจ้าของสวน',cancel:{date:d1,at:d1+'T08:15',reason:'กดเลขศูนย์เกิน',by:'เจ้าของสวน'}},
    {id:'t3',no:'TU-2569-0002',date:d1,at:d1+'T08:16',amount:2000,note:'เติมไว้ซื้อถ้วยรองยาง',by:'เจ้าของสวน',cancel:null}]}
  {const k=addD(TODAY,-6);const p={id:'pOff1',date:k,roundId:'',kg:38,price:52.5,gross:1995,adj:[],lines:split.map(l=>({...l})),note:'ขายยางสด ร้านลุงชม DRC 33%'};p.amount=payNet(p);s.pays.push(p);
   ['w1','w2'].forEach(w=>{const l=splitCalc(p.amount,p.lines).lines.find(l=>l.who===w);if(l)s.payouts[p.id+'|'+w]={date:k,amount:l.baht,ded:0}})}
  s.advances.push({id:uid(),src:FUND,who:'w2',date:addD(TODAY,-8),amount:300,note:'ค่ารักษาลูก (เบิกจากกองกลาง)'});
  // ลุงแดงกรีดแทนสมชาย 1 วัน จ่ายรายวัน
  {const k=addD(TODAY,-3);s.days[k]={off:false,workers:['w3']};s.extras.push({id:uid(),date:k,wid:'w3',name:'ลุงแดง',job:'กรีดแทน',amount:350,from:OWNER,note:'กรีดแทนลูกจ้างประจำ',paid:k,due:null,tap:true})}
  s.lastBackup=addD(TODAY,-2);
  delete s.days[TODAY];delete s.days[addD(TODAY,-1)];/* ให้เห็นป๊อปอัปถามวันที่ยังไม่บันทึก */
  return s;
}
const PKEY='rubber-profiles';
let P=(()=>{try{const r=localStorage.getItem(PKEY);if(r)return JSON.parse(r)}catch(e){}return {list:[{id:'p1',name:'เจ้าของสวน'}],active:'p1'}})();
const saveP=()=>{try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}};

function pairLan(C,W){
  const cs=[...C].sort(),ws=[...W].sort();const out=[],errs=[],used=new Set();
  cs.forEach((c,i)=>{const nc=cs[i+1];const cand=ws.filter(w=>w>=c&&(!nc||w<nc));cand.forEach(w=>used.add(w));
    if(!cand.length)errs.push(`รวมยาง ${thShort(c)} ${+c.slice(0,4)+543} ยังไม่มีวันชั่งยาง`);
    else if(cand.length>1)errs.push(`หลังรวมยาง ${thShort(c)} มีวันชั่งยาง ${cand.length} วัน (ควรมี 1 วัน)`);
    else out.push({collect:c,weigh:cand[0]})});
  ws.filter(w=>!used.has(w)).forEach(w=>errs.push(`ชั่งยาง ${thShort(w)} ${+w.slice(0,4)+543} ไม่มีวันรวมยางก่อนหน้า`));
  let ls=null,n=0;out.forEach(r=>{const z=seasonOf(r.weigh);if(z!==ls){ls=z;n=0}r.n=++n});
  return {out,errs};
}

function niceStep(r){const e=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e}
function chart(type,data,color,unit,id){

  if(type!=='bar'){const pad=(hi-lo)*0.25||hi*0.05||1;lo-=pad;hi+=pad}

    const ld=data[n-1];marks+=`<text class="lbl2" x="${Math.min(x(n-1),W-r-2)}" y="${y(ld.v)-10}" text-anchor="end">${fmt(ld.v)}</text>`}

      upd();
      q('#save').onclick=()=>{
        const err=q('#err');const c=splitCalc(d.amount,d.lines);
        d.note=q('#pNote').value.trim();
        if(d.smode==='round'&&!d.roundId) return err.textContent='ลานนี้ยังไม่มีรอบที่ชั่งแล้วรอรับเงิน กรุณาตรวจสอบวันในแท็บรอบขาย หรือเลือก "นอกรอบ"';
        if(d.smode==='off')d.roundId='';
        if(!(+d.kg>0&&+d.price>0)&&!(d.gross>0)) return err.textContent='กรุณากรอกทั้งน้ำหนักและราคา';
        for(const a of d.adj){if(!String(a.label).trim())return err.textContent='กรุณาระบุรายละเอียดของรายการหน้างานให้ครบทุกบรรทัด';if(!(+a.amount>0))return err.textContent='กรุณากรอกจำนวนเงินของ "'+a.label+'"'}

        after(back);
        if(!ex&&!S.sample) setTimeout(()=>ask('บันทึกรับเงินแล้ว จะบันทึกไฟล์สำรองไว้เลยไหม','สำรองเลย',()=>fileBackup()),350);
      };
      const del=q('#del');if(del) del.onclick=()=>ask('ลบรายการรับเงินนี้ใช่ไหม','ลบ',()=>{S.pays=S.pays.filter(p=>p!==ex);after(back)});
    });

  function upd(){
    const c=splitCalc(d.amount,d.lines);

  }

}

        const o={id:d.id,date:d.date,wid:d.wid,name:wname(d.wid),job:d.job.trim(),amount:+d.amount,from:d.from,note:d.note.trim(),
          paid:d.pst==='today'?d.date:d.pst==='paid'?d.paid:null,due:d.pst==='later'?d.due:null};

      if(isA&&!src) return q('#err').textContent='กรุณาเลือกว่าเบิกจากกองกลางหรือเงินส่วนตัว';
      const amt=+q('#sAmt').value;if(!(amt>0)) return q('#err').textContent='กรุณากรอกจำนวนเงิน';

async function fileBackup(msg){const t=packBk();const name=`สมุดกรีดยาง-${me().name}-${TODAY}.json`;const say=(c,x)=>{if(msg){msg.style.color=c;msg.textContent=x}else toast(x)};

    else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

async function hpin(pin,id){const t=new TextEncoder().encode('rubber:'+id+':'+pin);
  try{const b=await crypto.subtle.digest('SHA-256',t);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of t)h=(h*31+c)|0;return 'f'+h}}
function lockScreen({mode,id,onOk,cancel,title,onCancel}){
  const G=document.getElementById('lock');let buf='',first=null,step=mode;
  const u=()=>P.list.find(x=>x.id===id);
  function draw(msg,bad){
    const heads={check:'ใส่รหัสผ่าน',set:'ตั้งรหัสผ่าน 4 หลัก',confirm:'ใส่รหัสอีกครั้งเพื่อยืนยัน'};
    G.innerHTML=`<div class="lockwrap" role="dialog" aria-modal="true" aria-label="${heads[step]}"><div class="lk">
      <div class="app">สมุดกรีดยาง</div>
      ${mode==='check'&&!cancel&&P.list.length>1?`<div class="ustrip">${P.list.map(x=>`<button data-sw="${x.id}" aria-pressed="${x.id===id}">${avHTML(x)}<span>${esc(x.name)}</span></button>`).join('')}</div><div class="note">แตะรูปเพื่อเปลี่ยนผู้ใช้</div>`:avHTML(u())}<h2>${esc(title||heads[step])}</h2><div class="lmsg" style="margin-top:-8px">${esc(u().name)}</div>
      <div class="pdots ${bad?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'on':''}"></i>`).join('')}</div>
      <div class="lmsg ${bad?'bad':''}">${esc(msg||(step==='set'?'ใช้รหัสนี้ทุกครั้งที่เปิดแอป':''))}</div>
      <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
        ${cancel?'<button class="t" data-k="c">ยกเลิก</button>':'<span></span>'}<button data-k="0">0</button><button class="t" data-k="b" aria-label="ลบ">ลบ</button></div>
      ${step==='set'?'<div class="note" style="text-align:center">จำรหัสไว้ให้ดี ถ้าลืมจะเปิดสมุดนี้ไม่ได้ ควรสำรองข้อมูลไว้เสมอ</div>':''}
    </div></div>`;
    G.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
    G.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{id=b.dataset.sw;buf='';step=P.list.find(x=>x.id===id).pin?'check':'set';draw()});
  }
  async function key(k){
    if(k==='c'){G.innerHTML='';document.removeEventListener('keydown',kd);onCancel&&onCancel();return}
    if(k==='b'){buf=buf.slice(0,-1);return draw()}
    if(buf.length>=4)return;buf+=k;draw();
    if(buf.length<4)return;
    const v=buf;buf='';
    if(step==='set'){first=v;step='confirm';return draw()}
    if(step==='confirm'){if(v!==first){step='set';first=null;return draw('รหัสไม่ตรงกัน ลองตั้งใหม่',true)}
      u().pin=await hpin(v,id);saveP();done();return}
    if(await hpin(v,id)===u().pin) done(); else draw('รหัสไม่ถูกต้อง',true);
  }
  function done(){G.innerHTML='';document.removeEventListener('keydown',kd);onOk&&onOk(id)}
  const kd=e=>{if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('b')};
  document.addEventListener('keydown',kd);
  draw();
}

function askToday(){if(!S.days[TODAY])askDay(TODAY,askPast);else askPast()}
function askPast(){const past=missingDays().filter(k=>k!==TODAY);if(!past.length)return;const G=document.getElementById('dlg');
  G.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="วันที่ยังไม่บันทึก"><div><h2>ยังมี ${past.length} วันที่ไม่ได้บันทึก</h2></div>
    <div class="miss" style="font-size:1rem">${past.map(k=>thDate(k)).join('<br>')}</div><div class="note">ต้องการบันทึกตอนนี้ไหม ระบบจะไล่ถามทีละวัน เริ่มจากวันที่เก่าที่สุด</div>
    <div class="actions"><button class="btn" id="apl">ไว้ทีหลัง</button><button class="btn primary" id="apg">บันทึกเลย</button></div></div></div>`;
  G.querySelector('#apl').onclick=()=>G.innerHTML='';
  const chain=l=>{if(!l.length){toast('บันทึกครบทุกวันแล้ว ✓');return}askDay(l[0],()=>chain(l.slice(1)))};
  G.querySelector('#apg').onclick=()=>chain(past)}
document.getElementById('userBtn').onclick=openUsers;
document.getElementById('helpBtn').onclick=openGuide;
function openGuide(){
  const st=(n,t,b,ex)=>`<div class="gstep"><span class="gn">${n}</span><div class="gb"><h3>${t}</h3><div class="note" style="font-size:.95rem;color:var(--ink)">${b}</div>${ex?`<div class="gex">${ex}</div>`:''}</div></div>`;
  const ln=(k,v,c)=>`<div class="sline"><span>${k}</span><b${c?` style="color:${c}"`:''}>${v}</b></div>`;
  sheet('วิธีใช้','ตั้งแต่เริ่มต้นจนจ่ายค่าแรง',`
    <div class="card">${[
    st(1,'ครั้งแรก: เพิ่มชื่อคนงาน','แท็บ <b>คนงาน</b> → กด <b>+</b> ที่ <b>ลูกจ้างประจำ</b> (กรีดแบ่ง %) หรือ <b>ลูกจ้างเสริม</b> (จ้างรายวัน/รายงาน)'),
    st(2,'เพิ่มลานที่ไปขาย','แท็บ <b>รอบขาย</b> → <b>+ เพิ่มลาน</b> ตั้งชื่อลาน แล้วติ๊ก <b>วันรวมยาง</b> กับ <b>วันชั่งยาง</b> ในปฏิทินของลาน แอปจับคู่เป็นรอบ 1, 2, 3… ให้เอง มีหลายลานก็ได้'),
    st(3,'ทุกวัน: กรีดหรือหยุด','เปิดแอปแล้วจะถามเองว่า <b>วันนี้กรีดหรือหยุด</b> เลือกคนกรีดได้เลย ถ้าลืมบันทึกวันก่อนๆ จะถามย้อนให้ด้วย (แก้ทีหลังได้ที่หน้าวันในปฏิทิน)'),
    st(4,'วันรับเงิน: บันทึกรับเงิน','ปฏิทิน → กดวันที่ได้เงิน → <b>+ รับเงิน</b> → เลือกลาน (หรือ <b>นอกรอบ</b>) → ใส่น้ำหนักกับราคาตามใบชั่ง',
      ln('น้ำหนัก × ราคา','702 กก. × ฿25.60')+ln('ยอดขายยาง','฿17,971.20')),
    st(5,'ถ้าโดนหักหน้างาน','กด <b>− รายจ่ายหน้างาน</b> เช่น ค่าลาน ยางชื้น หรือ <b>+ รายรับหน้างาน</b> ถ้าได้เพิ่ม',
      ln('− ค่าลาน','−฿150','var(--warn)')+ln('ยอดสุทธิที่นำมาแบ่ง','฿17,821.20','var(--leaf)')),
    st(6,'แบ่งเงิน','ใส่ % หรือบาทของแต่ละคน นายจ้างตั้งเป็น <b>ที่เหลือ</b> ต้องขึ้น <b>"ครบพอดี ✓"</b> ถึงบันทึกได้',
      ln('สมชาย 35%','฿6,237.42')+ln('กองกลาง 5%','฿891.06')+ln('นายจ้าง (ที่เหลือ)','฿10,692.72')),
    st(7,'ระหว่างเดือน','กดวันในปฏิทิน → <b>+ เบิกเงิน</b> (ลูกจ้างเบิกล่วงหน้า) / <b>+ จ้างเสริม</b> / <b>− ซื้อของ</b> (จ่ายจากกองกลาง) · วันข้างหน้าบันทึกนัดได้'),
    st(8,'จ่ายค่าแรงลูกจ้าง','แท็บ <b>สรุป</b> → <b>ค่าแรงลูกจ้าง</b> → ปุ่มแดง <b>จ่ายค่าจ้าง</b> → ติ๊กงวด แอปหักเงินเบิกให้เอง · กด <b>ใบสรุปส่งไลน์</b> แคปส่งให้ลูกจ้างได้',
      ln('ส่วนแบ่ง','฿6,237.42')+ln('หักเบิก','−฿500','var(--warn)')+ln('จ่ายจริง','฿5,737.42','var(--leaf)')),
    st(9,'กองกลาง (กระเป๋า)','แท็บ <b>สรุป</b> → <b>กองกลาง</b> → <b>ทำรายการ</b> ดูประวัติเงินเข้าออก และ <b>เติมเงิน</b> (ใส่รหัส มีสลิป ถ้ากดผิดยกเลิกได้)'),
    st(10,'สำรองข้อมูล (สำคัญ)','ข้อมูลอยู่ในมือถือเครื่องนี้เท่านั้น กดรูปผู้ใช้มุมขวาบน → <b>💾 บันทึกไฟล์สำรอง</b> แล้วส่งเข้าไลน์หรือ Google Drive เก็บไว้ ถ้าเครื่องหายก็กู้คืนจากไฟล์ได้'),
    ].join('')}</div>
    <div class="card futcard"><h3>ข้อมูลตัวอย่าง</h3><div class="note" style="color:var(--ink)">${S.sample?'ตอนนี้กำลังดูข้อมูลตัวอย่าง ข้อมูลจริงเก็บแยกไว้ ไม่หาย':'เปิดดูตัวอย่างการจดบันทึกได้ ข้อมูลจริงเก็บแยกไว้ ไม่หาย กดล้างตัวอย่างแล้วกลับมาเหมือนเดิม'}</div>
      <button class="btn ${S.sample?'':'primary'}" id="gDemo">${S.sample?'ล้างตัวอย่าง กลับไปข้อมูลจริง':'เปิดดูข้อมูลตัวอย่าง'}</button></div>
    <div class="card"><h3>ขนาดตัวหนังสือ</h3><div class="note">ปรับได้ที่หน้าผู้ใช้ (กดรูปมุมขวาบน)</div></div>`,
  el=>{el.querySelector('#gDemo').onclick=()=>S.sample?ask('ล้างตัวอย่าง แล้วกลับไปที่ข้อมูลจริงของคุณใช่ไหม','ล้างตัวอย่าง',exitDemo):enterDemo()});
}
function seedSampleStmt(){if(!S.sample||(S.stmts||[]).length)return;try{const y=now.getFullYear(),m=now.getMonth(),py=m?y:y-1,pm=m?m-1:11;const from=iso(py,pm,1),to=iso(py,pm,new Date(py,pm+1,0).getDate());
  const no='ST-'+(+TODAY.slice(0,4)+543)+'-0001';S.stmts=[{no,at:'วันที่ 1 '+TH_M[m]+' (ตัวอย่าง)',from,to,html:stmtHTML(from,to,no,'ฉบับบันทึก · ตัวอย่าง','saved')}];save()}catch(e){}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;PIE_TAB='all';render();window.scrollTo(0,0)});
